<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- 3D Spherical Bevel Gradient -->
    <radialGradient id="sphereGrad_C" cx="38%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#84FFFF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00E5FF"/>
      <stop offset="75%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <radialGradient id="innerRim_C" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#006064" stop-opacity="0"/>
      <stop offset="100%" stop-color="#006064" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Bubble Body with Sphere Gradient -->
  <circle cx="64" cy="64" r="56" fill="url(#sphereGrad_C)" filter="url(#dropShadow)" />
  <!-- Inner Rim Shading -->
  <circle cx="64" cy="64" r="56" fill="url(#innerRim_C)" stroke="#006064" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Top-Left Specular Shine Oval (Rotated -40 deg) -->
  <g transform="translate(44, 42) rotate(-40)">
    <ellipse cx="0" cy="0" rx="15" ry="7.5" fill="#FFFFFF" fill-opacity="0.82" />
  </g>

  <!-- Pinpoint Sparkle Highlight -->
  <circle cx="51.5" cy="35" r="4.2" fill="#FFFFFF" fill-opacity="0.95" />
</svg>